# Render Blueprint for the alert backend (WebSocket relay + REST history API).
#
# Deploy: on render.com, New → Blueprint → point at this repo. Render provisions
# the Postgres database, injects DATABASE_URL and PORT into the web service, and
# gives it a public https/wss URL. Then set VITE_WS_URL on the Vercel project to
# wss://<this-service>.onrender.com and redeploy the client.
databases:
  - name: smart-warning-db
    plan: free
    databaseName: smartwarning
    user: smartwarning

services:
  - type: web
    name: smart-warning-relay
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      # Durable incident history + multi-tenant orgs. Wired automatically from the
      # database above. Its presence also switches the backend into orgs/accounts
      # mode (per-org rooms + supervisor login).
      - key: DATABASE_URL
        fromDatabase:
          name: smart-warning-db
          property: connectionString
      # Secret used to sign supervisor session tokens (JWT). Render generates a
      # strong random value; keep it stable or existing sessions are invalidated.
      - key: JWT_SECRET
        generateValue: true
      # Legacy shared token — only used when there is NO database (single-room
      # relay). Ignored once orgs are enabled. Leave unset.
      - key: RELAY_TOKEN
        sync: false
