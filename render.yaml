# Render Blueprint for the app server: the built client and the REST API +
# WebSocket relay, served by one service from one URL. Render still gives it a
# public https/wss URL and injects PORT. Nothing else to configure — because
# the client is served from the same origin as the API, there are no
# cross-host URLs to keep in sync.
#
# The build runs from the repository root so it can compile client/ before
# installing the server. Hosting the client elsewhere (a CDN, Vercel) still
# works: without client/dist the server simply runs API-only.
#
# Postgres is Supabase, not a Render-provisioned database (moved 2026-09 to
# get off Render's paid Postgres plan) — see DATABASE_URL below. Nothing else
# in this app needs to know which provider it is; the server talks to it as
# plain Postgres either way (server/db.js).
#
# ⚠️ There used to be a `databases: [smart-warning-db]` block here that Render
# auto-provisioned and billed for. Removing it from this file does NOT delete
# that database in Render — Render blueprints only create/update declared
# resources, never delete ones you've removed. If the Supabase cutover below
# is verified working, go delete (or downgrade) `smart-warning-db` yourself in
# the Render dashboard, or you'll keep paying for a database nothing reads
# from anymore.
services:
  - type: web
    name: smart-warning-relay
    runtime: node
    plan: starter
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      # Durable incident history + multi-tenant orgs. Its presence also switches
      # the backend into orgs/accounts mode (per-org rooms + supervisor login).
      #
      # A manual secret pointing at Supabase Postgres, not a Render-provisioned
      # database — set the actual connection string in the Render dashboard
      # (Environment tab). Use Supabase's pooled/transaction-mode connection
      # string (port 6543), not the direct one — Render's plan does not hold a
      # single long-lived connection the way a VPS would, and the app opens a
      # normal `pg` pool.
      - key: DATABASE_URL
        sync: false
      # Secret used to sign supervisor session tokens (JWT). Render generates a
      # strong random value; keep it stable or existing sessions are invalidated.
      - key: JWT_SECRET
        generateValue: true
      # Legacy shared token — only used when there is NO database (single-room
      # relay). Ignored once orgs are enabled. Leave unset.
      - key: RELAY_TOKEN
        sync: false
      # Firebase Cloud Messaging service account (Android native push, closed-app
      # delivery). Optional: without it, web push still works but Android users
      # get no alerts while the app is closed. See docs/FIREBASE_SETUP.md.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # SMTP connection string (nodemailer URL syntax). Optional: without it,
      # mail queues safely in outbound_mail and delivers the backlog once this
      # is set. See docs/SMTP_SETUP.md.
      - key: SMTP_URL
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FEEDBACK_TO
        sync: false
      # ClickPesa — mobile money collection (Mixx by Yas, M-Pesa, Airtel Money,
      # HaloPesa, EzyPesa) in TZS. Optional: without these the app runs, every
      # org sits on the free tier, and the plan catalogue is still served — there
      # is simply no way to start a mobile money checkout. Paste the values
      # without surrounding quotes; Render stores them literally and a quoted key
      # reaches the gateway with the quotes attached, which comes back as
      # "Invalid client details" and looks exactly like a wrong key.
      # See docs/PAYMENTS_SETUP.md.
      - key: CLICKPESA_CLIENT_ID
        sync: false
      - key: CLICKPESA_API_KEY
        sync: false
      # Optional per-application payload signing key. Defence in depth only —
      # every callback is re-verified against the gateway before anything is
      # provisioned, so an unsigned deployment is still not forgeable.
      - key: CLICKPESA_CHECKSUM_KEY
        sync: false
      # Stripe — cards, for customers outside the mobile money footprint.
      # Unlike the ClickPesa path the signature here IS the proof, so the
      # webhook secret is required for the callback, not optional.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Where Stripe Checkout returns the customer.
      - key: APP_URL
        sync: false
      # Paywall enforcement. Leave unset (off) until existing organizations have
      # been grandfathered — every org that predates billing migrates in as free,
      # so switching this on without preparation paywalls dashboards in daily
      # use. Alerting is never affected either way.
      - key: BILLING_ENFORCE
        sync: false
      # Self-hosted routing server (see the smart-warning-osrm service below),
      # replacing the free public router.project-osrm.org demo — no SLA, best
      # effort only. NOT declared via fromService: Render's private-network
      # host/port properties are for plain-HTTP internal traffic, and
      # server/routing.js expects a full URL with scheme. Set this by hand,
      # once smart-warning-osrm exists and has a real URL, to that service's
      # public HTTPS address (e.g. https://smart-warning-osrm.onrender.com) —
      # see osrm/README.md. Leave unset and the code default
      # (router.project-osrm.org) still applies, exactly as it did before this
      # service existed — nothing breaks either way, this is a quality-of-
      # routing upgrade, never a required one.
      - key: ROUTING_URL
        sync: false

  # Self-hosted OSRM routing, Tanzania only — see osrm/README.md for what this
  # is, why the scope is Tanzania, and how to widen it. A second, separately
  # billed service: check its plan against current Render pricing before
  # approving this Blueprint change. Does NOT auto-rebuild on every push to
  # main the way the relay does above — there is nothing in this service that
  # depends on this repo's application code, only the Dockerfile here, so a
  # rebuild is only worth triggering to refresh the map data or bump the OSRM
  # image version.
  #
  # plan is 1c-2g (1 CPU, 2GB RAM, ~$25/mo), not the relay's starter/512MB —
  # the first deploy on starter built fine but crashed at runtime with zero
  # output from osrm-routed. Then 1c-2g crashed the SAME way, at nearly the
  # same ~50s mark, which argues against simple OOM (more RAM should survive
  # longer, not die at the same wall-clock time) — see osrm/Dockerfile's
  # current diagnostic comment for what's being isolated before spending on
  # another plan guess. Don't downgrade the plan without re-testing against a
  # real deploy, not just a hunch.
  #
  # healthCheckPath is temporarily two Liechtenstein points (Vaduz -> Schaan),
  # matching the diagnostic extract in osrm/Dockerfile — revert together.
  - type: web
    name: smart-warning-osrm
    runtime: docker
    dockerfilePath: ./osrm/Dockerfile
    dockerContext: ./osrm
    plan: 1c-2g
    healthCheckPath: /route/v1/driving/9.5209,47.1410;9.5083,47.1662
