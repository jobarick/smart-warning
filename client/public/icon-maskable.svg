<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Smart Warning">
  <!--
    Maskable variant. A maskable icon may be cropped to any shape the platform
    likes — circle, squircle, teardrop — and only the centre 80% is guaranteed
    to survive. This one is full-bleed with the mark scaled down to sit inside
    that safe zone, so no launcher can clip the exclamation off the bottom.
  -->
