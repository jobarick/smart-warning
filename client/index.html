<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS ignores SVG touch icons and falls back to a screenshot of the page,
         which for a dark app is an unreadable grey square. Give it a PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Smart Warning" />
    <title>Smart Warning — Emergency Alert System</title>

    <!-- How this link looks when it is shared.
         A Safety Coordinator hands this product to their team by pasting the
         URL into a chat, so the preview card is not decoration — it is the
         first thing most people will ever see of it. Without these tags the
         card renders as a bare grey box with a domain under it.
         og:image must be absolute: a scraper has no page to resolve it against. -->
    <meta name="description" content="Raise the alarm on every phone at once, with your live location. Emergency alerting for one person or a whole site, by Idefenda Lab. Complements emergency services — it does not replace them." />
    <link rel="canonical" href="https://smart-warning.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Smart Warning" />
    <meta property="og:title" content="Smart Warning — help arrives faster when everyone knows at once" />
    <meta property="og:description" content="One tap raises the alarm on every phone on your site, with your live location. For one person, or a team of five hundred." />
    <meta property="og:url" content="https://smart-warning.vercel.app/" />
    <meta property="og:image" content="https://smart-warning.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Smart Warning — emergency alerting for one person, or a whole site." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Warning — help arrives faster when everyone knows at once" />
    <meta name="twitter:description" content="One tap raises the alarm on every phone on your site, with your live location. For one person, or a team of five hundred." />
    <meta name="twitter:image" content="https://smart-warning.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
