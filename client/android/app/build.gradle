apply plugin: 'com.android.application'

// Release signing material, kept out of the repository.
//
// Read from keystore.properties for a local release build, or from the
// environment for CI. If neither is present the release build still runs and
// simply produces an unsigned artifact, so a developer who only wants to check
// that the release variant compiles is not forced to hold the upload key.
//
// Losing this key means never being able to update the Play listing again —
// see docs/ANDROID_RELEASE.md.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def storeFilePath = keystoreProperties.getProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_FILE')
def storePasswordValue = keystoreProperties.getProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyAliasValue = keystoreProperties.getProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS')
def keyPasswordValue = keystoreProperties.getProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD')
def hasSigningConfig =
        storeFilePath != null &&
        storePasswordValue != null &&
        keyAliasValue != null &&
        keyPasswordValue != null &&
        rootProject.file(storeFilePath).exists()

android {
    namespace = "com.smartwarning.app"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = "26.1.10909125"
    defaultConfig {
        applicationId "com.smartwarning.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects an upload whose versionCode it has already seen, so CI
        // passes the build number in: -PversionCode=42 -PversionName=1.0.42
        versionCode project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
        versionName project.hasProperty('versionName') ? project.versionName : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile rootProject.file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            // Deliberately left off. R8 strips classes it cannot see being
            // used, and Capacitor resolves plugins reflectively — a wrong keep
            // rule produces an app that builds, installs, and then fails to
            // register push or geolocation at the moment of an emergency.
            // Turning this on is worth doing, but only together with an
            // on-device test of the release variant, which cannot be done from
            // the build alone. The app is ~6 MB; size is not the constraint.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
            packagingOptions {
                doNotStrip "**/*.so"
            }
        }
    }

    // Say plainly at build time which artifact came out, so an unsigned bundle
    // is never mistaken for an uploadable one.
    applicationVariants.configureEach { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.configureEach {
                println hasSigningConfig
                    ? "[smart-warning] release build will be signed with ${keyAliasValue}"
                    : "[smart-warning] WARNING: no keystore found — release output will be UNSIGNED and Play will reject it. See docs/ANDROID_RELEASE.md"
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
