apply plugin: 'com.android.application'

// Release signing material, kept out of the repository.
//
// Read from keystore.properties for a local release build, or from the
// environment for CI. If neither is present the release build still runs and
// simply produces an unsigned artifact, so a developer who only wants to check
// that the release variant compiles is not forced to hold the upload key.
//
// Losing this key means never being able to update the Play listing again —
// see docs/ANDROID_RELEASE.md.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def storeFilePath = keystoreProperties.getProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_FILE')
def storePasswordValue = keystoreProperties.getProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyAliasValue = keystoreProperties.getProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS')
def keyPasswordValue = keystoreProperties.getProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD')
def hasSigningConfig =
        storeFilePath != null &&
        storePasswordValue != null &&
        keyAliasValue != null &&
        keyPasswordValue != null &&
        rootProject.file(storeFilePath).exists()

android {
    namespace = "com.smartwarning.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.smartwarning.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects an upload whose versionCode it has already seen, so CI
        // passes the build number in: -PversionCode=42 -PversionName=1.0.42
        versionCode project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
        versionName project.hasProperty('versionName') ? project.versionName : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile rootProject.file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            // Capacitor's own consumer ProGuard rules (bundled in the
            // capacitor-android module and pulled in automatically via
            // consumerProguardFiles) keep every class extending
            // com.getcapacitor.Plugin and every @PluginMethod — that covers
            // the bridge's reflective dispatch. Firebase's messaging SDK
            // ships its own consumer rules too.
            //
            // Enabled 2026-08-11. Verified on this exact release variant, on
            // device: the app runs clean with no reflection-related
            // exceptions in logcat, and the live geolocation permission flow
            // (Capacitor's Permission-callback reflection path) works.
            // PushNotificationsPlugin's presence in mapping.txt was confirmed
            // kept unrenamed (identity mapping) — a live push-registration
            // round trip was NOT exercised, since that needs a signed-in
            // session this check deliberately didn't create against
            // production. Re-verify the same way (build, install, check
            // mapping.txt + an on-device run) after a Capacitor or plugin
            // version bump — see docs/ANDROID_RELEASE.md.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Say plainly at build time which artifact came out, so an unsigned bundle
    // is never mistaken for an uploadable one.
    applicationVariants.configureEach { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.configureEach {
                println hasSigningConfig
                    ? "[smart-warning] release build will be signed with ${keyAliasValue}"
                    : "[smart-warning] WARNING: no keystore found — release output will be UNSIGNED and Play will reject it. See docs/ANDROID_RELEASE.md"
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
