name: Synthetic canary

# Checks that the two things a real emergency would need are actually still
# answering, on a schedule, whether or not anyone happens to be looking.
# Closes the "no synthetic canary" gap from docs/GLOBAL_READINESS_AUDIT.md —
# deliberately the cheapest possible version: no new account, no paid
# service, no secret. It only ever hits the same public, unauthenticated
# `/api/health` endpoint the app itself already exposes for exactly this
# purpose, plus the public frontend.
#
# On failure it opens one GitHub issue (or leaves an existing one alone,
# rather than filing a duplicate every ten minutes) and closes it again with
# a comment the next time the canary passes. That is the entire alerting
# mechanism — no Slack/PagerDuty wiring, on purpose, so this has nothing to
# misconfigure and nothing to go stale. Escalating from "a GitHub issue" to
# a paged on-call is real, separate work (see the P0 list in the audit doc).
# NOTE: GitHub runs scheduled workflows late. Over 2026-10-11..17 this ran
# about every 2 to 6 hours, not every 10 minutes, so it is a backstop, not
# the uptime monitor: docs/MONITORING_SETUP.md sets up an external one.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

env:
  BACKEND_HEALTH_URL: https://smart-warning-production.up.railway.app/api/health
  BACKEND_READY_URL: https://smart-warning-production.up.railway.app/api/ready
  NUMBERS_URL: https://smart-warning-production.up.railway.app/api/emergency/directory?country=TZ
  FRONTEND_URL: https://smart-warning.vercel.app/
  CANARY_LABEL: canary-failure

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check backend health (/api/health)
        id: backend
        run: |
          response=$(curl -sS --max-time 10 --retry 2 --retry-delay 3 --retry-connrefused \
            -w '\n%{http_code}' "$BACKEND_HEALTH_URL") || {
            echo "reason=Backend unreachable: could not connect to $BACKEND_HEALTH_URL" >> "$GITHUB_OUTPUT"
            echo "::error::backend unreachable"
            exit 1
          }
          http_status=$(echo "$response" | tail -n1)
          json=$(echo "$response" | sed '$d')
          echo "HTTP status: $http_status"

          if [ "$http_status" != "200" ]; then
            echo "reason=Backend health endpoint returned HTTP $http_status" >> "$GITHUB_OUTPUT"
            echo "::error::backend returned HTTP $http_status"
            exit 1
          fi

          # A host that answers 200 for some other app (Railway's "Application
          # not found" page, a parked domain) must not count as healthy.
          service=$(echo "$json" | jq -r '.service // "null"' 2>/dev/null || echo "not-json")
          if [ "$service" != "alert-backend" ]; then
            echo "reason=$BACKEND_HEALTH_URL answered, but not as the Smart Warning backend (service=$service)" >> "$GITHUB_OUTPUT"
            echo "::error::unexpected service ($service)"
            exit 1
          fi

          db_ok=$(echo "$json" | jq -r '.database.ok // "null"')
          if [ "$db_ok" != "true" ]; then
            echo "reason=Backend is reachable but reports database.ok=$db_ok — the last real query against Postgres did not succeed" >> "$GITHUB_OUTPUT"
            echo "::error::database not ok ($db_ok)"
            exit 1
          fi
          echo "Backend healthy: HTTP 200, database.ok=true"

      # /api/ready answers 503 when the database check failed or has stopped
      # coming back (a hung query), which /api/health alone does not catch.
      - name: Check backend readiness (/api/ready)
        id: ready
        if: always()
        run: |
          response=$(curl -sS --max-time 15 --retry 2 --retry-delay 3 -w '
%{http_code}' "$BACKEND_READY_URL") || {
            echo "reason=Readiness endpoint unreachable" >> "$GITHUB_OUTPUT"; echo "::error::ready unreachable"; exit 1; }
          http_status=$(echo "$response" | tail -n1); json=$(echo "$response" | sed '$d')
          echo "HTTP status: $http_status, body: $json"
          ready=$(echo "$json" | jq -r '.ready // "null"' 2>/dev/null || echo "not-json")
          if [ "$http_status" != "200" ] || [ "$ready" != "true" ]; then
            echo "reason=Backend not ready (HTTP $http_status, ready=$ready, database=$(echo "$json" | jq -r '.database // "?"' 2>/dev/null))" >> "$GITHUB_OUTPUT"
            echo "::error::backend not ready"; exit 1
          fi
          echo "Backend ready"

      # The emergency numbers are the one thing the app must always be able to
      # show. Checks the public Tanzania list still answers with 112 and the
      # verified health line, and never with the removed 117.
      - name: Check Tanzania emergency numbers
        id: numbers
        if: always()
        run: |
          json=$(curl -sS --max-time 15 --retry 2 --retry-delay 3 "$NUMBERS_URL") || {
            echo "reason=Emergency numbers endpoint unreachable" >> "$GITHUB_OUTPUT"; echo "::error::numbers unreachable"; exit 1; }
          country=$(echo "$json" | jq -r '.country.code // "null"' 2>/dev/null || echo "not-json")
          has112=$(echo "$json" | jq 'any(.services[]?.numbers[]?; . == "112")' 2>/dev/null || echo false)
          has199=$(echo "$json" | jq 'any(.services[]?.numbers[]?; . == "199")' 2>/dev/null || echo false)
          has117=$(echo "$json" | jq 'any(.services[]?.numbers[]?; . == "117")' 2>/dev/null || echo true)
          echo "country=$country 112=$has112 199=$has199 117=$has117"
          if [ "$country" != "TZ" ] || [ "$has112" != "true" ] || [ "$has199" != "true" ] || [ "$has117" != "false" ]; then
            echo "reason=Tanzania emergency numbers wrong or missing (country=$country, 112=$has112, 199=$has199, 117=$has117)" >> "$GITHUB_OUTPUT"
            echo "::error::emergency numbers check failed"; exit 1
          fi
          echo "Emergency numbers OK"

      # Runs regardless of whether the backend check above passed, so one
      # outage doesn't hide whether the other half is also down.
      - name: Check frontend
        id: frontend
        if: always()
        run: |
          status=$(curl -sS -o /dev/null --max-time 10 --retry 2 --retry-delay 3 --retry-connrefused \
            -w '%{http_code}' "$FRONTEND_URL") || status="unreachable"
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "reason=Frontend ($FRONTEND_URL) returned HTTP $status" >> "$GITHUB_OUTPUT"
            echo "::error::frontend returned HTTP $status"
            exit 1
          fi
          echo "Frontend healthy: HTTP 200"

      - name: Open (or leave open) a failure issue
        if: failure()
        uses: actions/github-script@v8
        env:
          BACKEND_REASON: ${{ steps.backend.outputs.reason }}
          READY_REASON: ${{ steps.ready.outputs.reason }}
          NUMBERS_REASON: ${{ steps.numbers.outputs.reason }}
          FRONTEND_REASON: ${{ steps.frontend.outputs.reason }}
        with:
          script: |
            const label = process.env.CANARY_LABEL;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Issue #${open[0].number} is already open for this — not filing a duplicate.`);
              return;
            }
            const reasons = [process.env.BACKEND_REASON, process.env.READY_REASON, process.env.NUMBERS_REASON, process.env.FRONTEND_REASON]
              .filter(Boolean)
              .map((r) => `- ${r}`)
              .join('\n');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 Synthetic canary: production health check failing',
              labels: [label],
              body: [
                `The synthetic canary detected a failure at ${new Date().toISOString()}.`,
                '',
                reasons || 'See the failed workflow run for details.',
                '',
                `Run: ${runUrl}`,
                '',
                'This closes itself automatically with a comment once the canary passes again — no need to close it by hand.',
              ].join('\n'),
            });

      - name: Close the failure issue on recovery
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const label = process.env.CANARY_LABEL;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Recovered — the canary passed again at ${new Date().toISOString()}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
