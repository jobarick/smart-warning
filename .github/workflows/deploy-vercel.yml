# Deploy the client to Vercel from CI.
#
# Why this exists: Vercel's own Git integration stopped triggering on this
# repository. Across five consecutive pushes Render rebuilt each commit within
# minutes while Vercel served the same bundle for days — the repo was provably
# buildable and the pushes provably landed, so the fault was in the integration,
# not the code. Diagnosing that from outside is guesswork, because a deployment
# that never starts produces no logs to read.
#
# Driving the deploy from here makes it a repository concern instead: every run
# is visible in the Actions tab, failures are loud, and a stale production
# bundle becomes impossible to mistake for a successful deploy.
name: Deploy client to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time. Cancelling superseded runs avoids an older
# commit finishing last and overwriting a newer one.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROD_URL: https://smart-warning.vercel.app

    steps:
      - uses: actions/checkout@v4

      # Fail with a sentence a human can act on, rather than letting the CLI
      # report a confusing auth error three steps later.
      - name: Check the required secrets exist
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ]      && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ]     && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "See docs/DEPLOYMENT.md for where each value comes from."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      # Pulls the project's own settings (framework, build command, output dir)
      # so CI builds it exactly as the dashboard would, rather than duplicating
      # that configuration here where it could drift.
      - name: Pull the project configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # The check that would have caught this problem on day one: compare the
      # asset hash we just built against what production actually serves. A
      # deploy that "succeeds" while the alias keeps serving an old bundle is
      # exactly the failure mode this workflow replaces.
      - name: Verify production is serving this build
        run: |
          local_js=$(basename "$(ls client/dist/assets/index-*.js | head -1)")
          echo "Built: $local_js"
          for attempt in 1 2 3 4 5 6; do
            served=$(curl -fsSL --max-time 30 "$PROD_URL/" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            echo "Attempt $attempt: production serves ${served:-<nothing>}"
            if [ "$served" = "$local_js" ]; then
              echo "Production is serving this build."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PROD_URL is still serving '$served' instead of '$local_js'."
          echo "The deploy reported success but the alias did not move."
          exit 1
